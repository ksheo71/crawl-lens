name: crawl-lens

services:
  web:
    build: .
    image: crawl-lens:latest
    container_name: crawl-lens-web
    environment:
      RUN_MIGRATIONS: "1"
    env_file: ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [edge_shared]
    healthcheck:
      # --spider returns success on any HTTP response, so 503 (worker not yet up)
      # still counts as "container can serve" — prevents the chicken-and-egg
      # deadlock with worker.depends_on web.service_healthy.
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:4500/api/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    ports:
      - "127.0.0.1:4500:4500"
    volumes:
      # Shared PDF cache: worker writes, web reads back to stream PDFs to clients
      - /opt/stack/data/crawl-lens/pdf:/data/pdf

  worker:
    image: crawl-lens:latest
    container_name: crawl-lens-worker
    command: ["node", "dist/worker/index.js"]
    env_file: ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [edge_shared]
    depends_on:
      web:
        condition: service_healthy
    volumes:
      # Shared PDF cache: worker writes, web reads back to stream PDFs to clients
      - /opt/stack/data/crawl-lens/pdf:/data/pdf

networks:
  edge_shared:
    external: true
