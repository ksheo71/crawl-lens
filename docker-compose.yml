name: crawl-lens

services:
  web:
    build: .
    image: crawl-lens:latest
    container_name: crawl-lens-web
    environment:
      RUN_MIGRATIONS: "1"
    env_file: ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [edge_shared]
    healthcheck:
      # Docker healthcheck purpose: gate worker start on web being "able to serve",
      # NOT on /api/health returning ok:true (that needs worker up — chicken-and-egg).
      # We connect to the port; any HTTP response (incl. 503) means web is up.
      # `|| true` forces exit 0 so 503 (worker absent) doesn't fail the check.
      # deploy.sh does the real ok:true verification afterwards.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:4500/api/health || true"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s
    # No host port mapping in production — Caddy reaches the container
    # via `crawl-lens-web:4500` on the shared edge_shared network.
    # For local manual testing, run `docker compose port web 4500`.
    volumes:
      # Shared PDF cache: worker writes, web reads back to stream PDFs to clients
      - /opt/stack/data/crawl-lens/pdf:/data/pdf

  worker:
    image: crawl-lens:latest
    container_name: crawl-lens-worker
    command: ["node", "dist/worker/index.js"]
    env_file: ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [edge_shared]
    depends_on:
      web:
        condition: service_healthy
    volumes:
      # Shared PDF cache: worker writes, web reads back to stream PDFs to clients
      - /opt/stack/data/crawl-lens/pdf:/data/pdf

networks:
  edge_shared:
    external: true
